name: Build os-findmy-e Android APK

on:
  push:
    branches:
      - build/os-findmy-e-20261110
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone pinned upstream repository
        run: |
          git clone https://github.com/sacca97/os-findmy-e.git source
          cd source
          git checkout d4d2a832baf47d1cf43d989879950ac2aec45f47
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Install Rust cross-compile requirements
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build clang libclang-dev pkg-config protobuf-compiler
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Compile native libraries for arm64
        working-directory: source
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018" ./native/android/build.sh arm64-v8a
      - name: Prepare non-Apple prebuilt dependencies
        working-directory: source
        run: |
          mkdir -p app/prebuilt/jniLibs/arm64-v8a app/prebuilt/java/com/sacca/openfinder/adi
          cp native/android/jniLibs/arm64-v8a/*.so app/prebuilt/jniLibs/arm64-v8a/
          cp native/android/com/sacca/openfinder/adi/CoreAdi.java app/prebuilt/java/com/sacca/openfinder/adi/
      - name: Use available Android 36 SDK for CI build
        working-directory: source
        run: |
          sed -i -e 's/compileSdk = 37/compileSdk = 36/' -e 's/targetSdk = 37/targetSdk = 36/' app/android/app/build.gradle.kts
      - name: Build signed debug APK (without Apple CoreADI)
        working-directory: source/app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify output
        run: |
          ls -lh source/app/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum source/app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: openfinder-debug-arm64
          path: source/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
